emulator:
  # "avd" = start an Android Studio emulator; "connect" = attach to BlueStacks/LDPlayer/MuMu over adb
  mode: avd
  avd_name: TopWar              # create with Android Studio's Device Manager (Google Play image, 1280x720)
  binary: emulator              # or full path, e.g. ~/Android/Sdk/emulator/emulator
  headless: false
  address: 127.0.0.1:5555       # used when mode: connect (BlueStacks default; LDPlayer 5555, MuMu 7555)
  serial: null                  # pin a specific adb device if several are attached
  adb: adb
  install_apk: null             # optional path to a Top War APK to install if missing

game:
  package: com.topwar.gp        # check with: adb shell pm list packages | grep -i war
  startup_wait: 25

templates_dir: templates

bot:
  unit_threshold: 0.88          # raise if units get mixed up, lower if they're missed
  button_threshold: 0.85
  battlefield_region: null      # [x1, y1, x2, y2] of the merge grid; limits false matches
  base_slots: null              # set to your base's slot count to auto-buy units into empty slots
  max_merge_level: null         # stop merging at this level (null = merge everything)
  merge_lowest_first: true      # frees slots fastest and lets merges chain upward
  max_merge_passes: 15
  cycle_delay: 5

# Makes the bot behave like a person. See topwar_bot/human.py for all options.
human:
  enabled: true
  reaction_mean: 0.55           # typical seconds between actions
  hesitation_chance: 0.06       # occasional longer pause
  tap_spread: 6                 # px scatter around each target
  curved_drags: true            # curved, eased drags (Android 11+), else straight swipes
  miss_chance: 0.04             # sometimes overlook a target until the next cycle
  shuffle_chance: 0.3           # sometimes merge in a looser order
  session_minutes: [25, 70]     # play this long...
  break_minutes: [4, 25]        # ...then take a break
  idle_chance: 0.08             # short idle pauses during play
  active_hours: [8, 23]         # only play 08:00-23:00 (null = any time)
